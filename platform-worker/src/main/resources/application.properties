spring.application.name=agent-platform-worker
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.datasource.url=${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
spring.datasource.username=${PLATFORM_DB_USER:agent_runtime}
spring.datasource.password=${PLATFORM_DB_PASSWORD}
spring.liquibase.enabled=false
spring.temporal.namespace=${PLATFORM_TEMPORAL_NAMESPACE:default}
spring.temporal.connection.target=${PLATFORM_TEMPORAL_TARGET:localhost:7233}
spring.temporal.workers-auto-discovery.packages=io.agentplatform.worker
spring.temporal.workers[0].task-queue=agent-runtime
spring.temporal.workers[0].capacity.max-concurrent-activity-executors=${PLATFORM_WORKER_CONCURRENCY:16}
platform.model=${PLATFORM_MODEL:demo}
spring.ai.model.chat=${platform.model}
spring.ai.model.embedding=${PLATFORM_EMBEDDING_PROVIDER:none}
spring.ai.openai.embedding.options.model=${PLATFORM_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=256
platform.embedding.mode=${PLATFORM_EMBEDDING_MODE:lexical}
platform.embedding.revision=${PLATFORM_EMBEDDING_REVISION:}
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.retry.max-attempts=1
spring.temporal.connection.enable-https=${PLATFORM_TEMPORAL_TLS:false}
management.tracing.sampling.probability=${PLATFORM_TRACE_SAMPLE:0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=${PLATFORM_METRICS_OTLP_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
