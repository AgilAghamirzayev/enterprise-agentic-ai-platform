# Set this to the GHCR repository prefix or an internal registry with all three images.
imagePrefix: registry.example.com/agent-platform
imageTag: "0.1.0"
imagePullSecrets: []
server:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}
worker:
  replicas: 1
  concurrency: 16
  # Comma-separated tenant=agent:version bindings for trusted Java handlers.
  javaAgents: ""
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}
studio:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
database:
  # The runtime Secret contains keys username, password and jdbc-url.
  runtimeSecret: agent-platform-database
  # The migration Secret contains keys username and password.
  migrationSecret: agent-platform-migrations
temporal:
  target: temporal-frontend:7233
  namespace: default
  tls: true
oidc:
  issuer: https://identity.example.com/realms/platform
  audience: agent-platform
  # Public SPA client for Authorization Code + PKCE. Leave empty to enter access tokens manually.
  studioClientId: ""
  scope: openid profile
model:
  mode: openai
  # In catalog mode, mount the ConfigMap key models.json in both Java workloads.
  catalogConfigMap: ""
  # Worker-only Secret with environment names matching the catalog credential references.
  credentialsSecret: ""
  baseUrl: https://api.openai.com
  name: gpt-4o-mini
  # Comma-separated additional IDs served by the configured deployment.
  allowed: ""
  # The provider Secret contains key api-key.
  secret: agent-platform-model
pricing:
  # Upper bounds in USD per million tokens. Define both rates together.
  inputPerMillion: ""
  outputPerMillion: ""
embeddings:
  mode: lexical
  name: text-embedding-3-small
  revision: ""
  baseUrl: https://api.openai.com
  secret: agent-platform-embeddings
connectors:
  # Optional Secret with key connectors.json. Mounted in the worker only.
  secret: ""
tracing:
  langfuseProjectUrl: ""
  samplingProbability: 0
  endpoint: ""
metrics:
  # Optional OTLP/HTTP metrics URL, including /v1/metrics.
  endpoint: ""
