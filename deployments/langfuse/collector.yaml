receivers:
  otlp:
    protocols:
      http: {endpoint: "0.0.0.0:4318"}
extensions:
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  filter/agent:
    error_mode: propagate
    traces:
      span:
        - 'attributes["langfuse.observation.type"] == nil'
      spanevent:
        - 'true'
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name"])
      - context: span
        statements:
          - keep_keys(span.attributes, ["langfuse.observation.type", "langfuse.trace.name", "langfuse.trace.metadata.runId", "langfuse.version", "agent.step.key", "type", "gen_ai.request.model", "gen_ai.provider.name", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens"])
          - set(span.status.message, "")
          # HTTP ingress is excluded from this destination. The admission is its visible root.
          - set(span.parent_span_id, SpanID(0x0000000000000000)) where span.name == "agent.run.submit"
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_ENDPOINT}
    headers: {x-langfuse-ingestion-version: "4"}
    auth: {authenticator: basicauth/langfuse}
    sending_queue: {enabled: true, queue_size: 512}
    retry_on_failure: {enabled: true, max_elapsed_time: 5m}
service:
  extensions: [basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/agent, transform/privacy, batch]
      exporters: [otlphttp/langfuse]
